<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Elon Musk Fan Site</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">← Back to Home</a>
        </div>
    </nav>

    <section class="section py-5">
        <div class="container">
            <div class="auth-form" data-aos="fade-up">
                <h2 class="text-center mb-4">Login to Your Account</h2>
                <form id="loginForm">
                    <div class="mb-3">
                        <label class="form-label">Email Address</label>
                        <input type="email" class="form-control" id="email" placeholder="you@example.com" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" value="demo123" required>
                    </div>
                    <button type="submit" class="btn btn-dark w-100 py-3">Login</button>
                </form>
                <p class="text-center mt-4">
                    Don't have an account? <a href="signup.html">Sign Up</a>
                </p>
            </div>
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>
    <script src="script.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value.trim();
            
            if (!email) {
                alert("Please enter your email");
                return;
            }

            // Get the saved user from localStorage (if they signed up before)
            let savedUser = localStorage.getItem('elonUser');
            let user;

            if (savedUser) {
                user = JSON.parse(savedUser);
                // Update email if different
                user.email = email;
            } else {
                // First time login - create user with email as name fallback
                user = {
                    name: email.split('@')[0],   // Use part before @ as name
                    email: email,
                    invested: 500,
                    joined: "March 2026"
                };
            }

            localStorage.setItem('elonUser', JSON.stringify(user));
            alert(`Login successful! Welcome back, ${user.name}`);
            window.location.href = "dashboard.html";
        });
    </script>
</body>
</html>

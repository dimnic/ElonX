<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Elon Musk Fan Site</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
     <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">← Back to Home</a>
        </div>
    </nav>

    <section class="section py-5">
        <div class="container">
            <div class="auth-form" data-aos="fade-up">
                <h2 class="text-center mb-4">Login</h2>

                <form id="loginForm">
                    <div class="mb-3">
                        <label class="form-label">Email Address</label>
                        <input type="email" class="form-control" id="email" placeholder="you@example.com" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" required>
                    </div>
                    <div class="mb-3 text-end">
                        <a href="#" onclick="forgotPasswordPrompt()" class="text-muted small">Forgot Password?</a>
                    </div>
                    <button type="submit" class="btn btn-dark w-100 py-3">Login</button>
                </form>

                <div class="text-center my-4 text-muted">— OR —</div>

                <button onclick="socialLogin('Google')" class="btn btn-light border w-100 mb-2">
                    Continue with Google
                </button>
                <button onclick="socialLogin('X')" class="btn btn-dark w-100 mb-2">
                    Continue with X
                </button>

                <p class="text-center mt-4">
                    Don't have an account? <a href="signup.html">Sign Up</a>
                </p>
            </div>
        </div>
    </section>

    <script src="script.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            loginUser(email, password);
        });

        function forgotPasswordPrompt() {
            const email = prompt("Enter your email to reset password:");
            if (email) forgotPassword(email);
        }

        function socialLogin(provider) {
            alert(`🔄 ${provider} login is coming soon.\n\nThis is a demo for now.`);
        }
    </script>
</body>
</html>

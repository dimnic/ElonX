<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery - Elon Musk</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .gallery-img {
            transition: all 0.4s ease;
            height: 300px;
            object-fit: cover;
        }
        .gallery-img:hover {
            transform: scale(1.08);
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }
        .gallery-item {
            overflow: hidden;
            border-radius: 12px;
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">← Back to Home</a>
        </div>
    </nav>
<br><br>
    <section class="section py-5 bg-light">
        <div class="container">
            <h2 class="text-center mb-5 display-4" data-aos="fade-down">Gallery</h2>
            
            <div class="row g-4">
                <div class="col-md-6 col-lg-4" data-aos="flip-left">
                    <div class="gallery-item shadow">
                        <img src="https://picsum.photos/id/1015/800/600" class="gallery-img w-100" alt="Elon Musk Portrait">
                        <div class="p-3 bg-white">
                            <h5>Elon Musk – Visionary Leader</h5>
                        </div>
                    </div>
                </div>
                <div class="col-md-6 col-lg-4" data-aos="flip-left" data-aos-delay="100">
                    <div class="gallery-item shadow">
                        <img src="https://picsum.photos/id/201/800/600" class="gallery-img w-100" alt="Tesla Cybertruck">
                        <div class="p-3 bg-white">
                            <h5>Tesla Cybertruck</h5>
                        </div>
                    </div>
                </div>
                <div class="col-md-6 col-lg-4" data-aos="flip-left" data-aos-delay="200">
                    <div class="gallery-item shadow">
                        <img src="https://picsum.photos/id/870/800/600" class="gallery-img w-100" alt="SpaceX Starship">
                        <div class="p-3 bg-white">
                            <h5>SpaceX Starship Launch</h5>
                        </div>
                    </div>
                </div>
                <div class="col-md-6 col-lg-4" data-aos="flip-left" data-aos-delay="300">
                    <div class="gallery-item shadow">
                        <img src="https://picsum.photos/id/106/800/600" class="gallery-img w-100" alt="Falcon 9 Landing">
                        <div class="p-3 bg-white">
                            <h5>Falcon 9 Booster Landing</h5>
                        </div>
                    </div>
                </div>
                <div class="col-md-6 col-lg-4" data-aos="flip-left" data-aos-delay="400">
                    <div class="gallery-item shadow">
                        <img src="https://picsum.photos/id/133/800/600" class="gallery-img w-100" alt="Neuralink">
                        <div class="p-3 bg-white">
                            <h5>Neuralink Brain Interface</h5>
                        </div>
                    </div>
                </div>
                <div class="col-md-6 col-lg-4" data-aos="flip-left" data-aos-delay="500">
                    <div class="gallery-item shadow">
                        <img src="https://picsum.photos/id/251/800/600" class="gallery-img w-100" alt="Tesla Factory">
                        <div class="p-3 bg-white">
                            <h5>Tesla Gigafactory</h5>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>
    <script src="script.js"></script>
</body>
</html>
